name: Release
run-name: Release ${{ github.ref_name }}

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify-tagged-commit:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $RELEASE_TAG points to $GITHUB_SHA, which is not on origin/$DEFAULT_BRANCH." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch> or a SemVer prerelease suffix." >&2
            exit 1
          fi

  test:
    name: Run tests
    needs: verify-tagged-commit
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  create-github-release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="bats-detik-${version}/" \
            --output="dist/bats-detik-${version}.tar.gz" "$GITHUB_SHA"
          (
            cd dist
            sha256sum -- * > SHA256SUMS
          )
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --verify-tag \
            --title "Bats detik ${RELEASE_TAG#v}" \
            --generate-notes \
            "${release_args[@]}"
