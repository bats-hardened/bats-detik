name: Test
on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:
  workflow_dispatch:

jobs:
  test-detik:
    name: Test DETIK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - name: Install Bats
      run: |
        bats_version="$(grep -m1 '^ARG BATS_VERSION=' Dockerfile | cut -d= -f2-)"
        bats_sha256="$(grep -m1 '^ARG BATS_SHA256=' Dockerfile | cut -d= -f2-)"
        bats_archive="$RUNNER_TEMP/bats-core.tar.gz"

        ./download.sh \
          "https://github.com/bats-core/bats-core/archive/refs/tags/v${bats_version}.tar.gz" \
          "$bats_archive"
        printf '%s  %s\n' "$bats_sha256" "$bats_archive" | sha256sum --check -

        tar -xzf "$bats_archive" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/bats-core-${bats_version}/install.sh" "$HOME/.local"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Test with bats
      run: bats tests/

  test-docker-build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
    - name: Execute the build script
      run: docker build -t bats/bats-detik .
