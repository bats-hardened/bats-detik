name: Test
on:
  workflow_call:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-detik:
    name: Test DETIK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Bats
      run: |
        bats_version="$(grep -m1 '^ARG BATS_VERSION=' Dockerfile | cut -d= -f2-)"
        bats_sha256="$(grep -m1 '^ARG BATS_SHA256=' Dockerfile | cut -d= -f2-)"
        bats_archive="$RUNNER_TEMP/bats-core.tar.gz"

        ./download.sh \
          "https://github.com/bats-hardened/bats-core/archive/refs/tags/v${bats_version}.tar.gz" \
          "$bats_archive"
        printf '%s  %s\n' "$bats_sha256" "$bats_archive" | sha256sum --check -

        tar -xzf "$bats_archive" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/bats-core-${bats_version}/install.sh" "$HOME/.local"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Test with bats
      run: bats tests/

  test-docker-build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute the build script
        run: docker build -t bats/bats-detik .

  super-linter:
    name: Run Super-Linter
    uses: bats-hardened/.github/.github/workflows/super-linter.yml@44fd251ecb1b4ca6fd2537eaa65be75b9be0395d # v1.1.1-beta01
    permissions:
      contents: read
