name: Test
on:
  workflow_call:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:
  workflow_dispatch:

jobs:
  test-detik:
    name: Test DETIK
    runs-on: ubuntu-latest
    steps:
    - name: Install BATS
      run: |
        git clone https://github.com/bats-core/bats-core.git && \
        cd bats-core && sudo ./install.sh /usr/local && \
        cd ..
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2
    - name: Test with bats
      run: bats tests/

  test-docker-build:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2
    - name: Execute the build script
      run: docker build -t bats/bats-detik .
